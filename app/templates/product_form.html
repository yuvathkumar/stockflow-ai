{% extends "base.html" %}

{% block title %}{{ title }} – StockFlow AI{% endblock %}

{% block content %}
    <h1>{{ title }}</h1>

    <form method="post" class="mt-3" style="max-width: 480px;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" name="name"
                   value="{{ values.name }}" required>
        </div>
        <div class="mb-3">
            <label for="quantity" class="form-label">Quantity</label>
            <input type="number" class="form-control" id="quantity" name="quantity"
                   value="{{ values.quantity }}" min="0" step="1" required>
        </div>
        <div class="mb-3">
            <label for="price" class="form-label">Price (₹)</label>
            <input type="number" class="form-control" id="price" name="price"
                   value="{{ values.price }}" min="0" step="0.01" required>
        </div>
        <div class="mb-3">
            <label for="reorder_level" class="form-label">Reorder level</label>
            <input type="number" class="form-control" id="reorder_level" name="reorder_level"
                   value="{{ values.reorder_level }}" min="0" step="1" required>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{ url_for('products') }}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
